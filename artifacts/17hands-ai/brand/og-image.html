<!--
  Source for public/og-image.png (1200x630 social share image).
  Regenerate from this folder:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=8000 --screenshot=../public/og-image.png og-image.html
  Content stays inside the centre 630px square: iMessage and some apps crop previews to a square.
  If the image changes, also rename the file and update index.html so caches refetch it.
  favicon-dark.svg is public/favicon.svg with the light-mode @media block removed.
-->
<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;color:#FAF8FD;
    background:radial-gradient(ellipse 60% 70% at 78% 8%,rgba(121,40,202,.45),transparent 70%),
               radial-gradient(ellipse 50% 60% at 15% 100%,rgba(224,167,134,.16),transparent 70%),
               linear-gradient(135deg,#13091E 0%,#0D0C13 55%,#241438 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .mark{width:250px;height:250px;margin-bottom:6px;filter:drop-shadow(0 10px 40px rgba(224,167,134,.25))}
  .word{font-family:'Space Grotesk';font-style:italic;font-weight:700;font-size:84px;letter-spacing:-.02em;line-height:1}
  .word span{color:#E0A786}
  .eyebrow{margin-top:24px;line-height:1.5;font-family:'JetBrains Mono';font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:#E0A786}
  .rule{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#7928CA,#E0A786)}
  .num{position:absolute;right:-30px;bottom:-120px;font-family:'Space Grotesk';font-style:italic;font-weight:700;font-size:520px;color:rgba(255,255,255,.03);line-height:1}
</style></head>
<body>
  <div class="num">17</div>
  <img class="mark" src="favicon-dark.svg" alt="">
  <div class="word">17hands<span>.ai</span></div>
  <div class="eyebrow">Security &amp; practical AI<br>for small businesses</div>
  <div class="rule"></div>
</body></html>
