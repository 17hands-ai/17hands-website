kind = "web"
previewPath = "/"
title = "17hands AI"
version = "1.0.0"
id = "artifacts/17hands-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19320

[services.development]
run = "pnpm --filter @workspace/17hands-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/17hands-ai", "run", "build" ]
publicDir = "artifacts/17hands-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19320"
BASE_PATH = "/"
